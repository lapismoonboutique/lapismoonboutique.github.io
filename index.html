<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lapis Moon Boutique | Crochet patterns</title>
<script>/* Lapis Moon Boutique: design rules.
   Direction: Retro-Futurist Pattern Lab (type + structure) x Dream Atelier (palette). */
const DESIGN = {
  color: {
    night: '#3B3F8F',  // text, anchors, primary button
    mist:  '#8C9EE8',  // art backgrounds, lines. Never body text
    butter:'#FFE9A8',  // badges, ticker, highlights only
    rose:  '#F7B8D2',  // the one accent
    haze:  '#E7DDFB',  // cards, quiet surfaces
    cloud: '#FFFBF6'   // page background
  },
  font: {
    display: "'Bricolage Grotesque', system-ui, sans-serif",
    mono: "'DM Mono', ui-monospace, monospace",
    href: 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=DM+Mono:wght@400;500&display=swap'
  },
  space: [4, 8, 12, 16, 24, 40, 64, 96],
  radius: { sm: '10px', md: '22px', pill: '999px' },
  motion: { fast: '160ms', slow: '600ms', ease: 'cubic-bezier(.2,.8,.2,1)' },
  rules: [
    'Palette is closed: six colors. Anything else must be a color-mix() of these.',
    'Rose is the only accent. Butter is for badges, ticker and highlights only.',
    'DM Mono is for data (specs, prices, labels). Bricolage Grotesque for everything else.',
    'Headlines: sentence case, two lines max, end with a period.',
    'Every pattern shows its spec strip: hook, yarn, hours.',
    'Motion is limited to orbit, ticker and hover lift. Honour prefers-reduced-motion.',
    'Text must meet WCAG AA. Night-on-mist is large text only.'
  ]
};
  const cssVars = (d = DESIGN) =>
  ':root{' +
  Object.entries(d.color).map(([k, v]) => `--${k}:${v}`).join(';') +
  `;--f-display:${d.font.display};--f-mono:${d.font.mono}` +
  Object.entries(d.radius).map(([k, v]) => `;--r-${k}:${v}`).join('') +
  `;--fast:${d.motion.fast};--slow:${d.motion.slow};--ease:${d.motion.ease}}`;

if (typeof module !== 'undefined') module.exports = { DESIGN, cssVars };
</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:var(--cloud);--fg:var(--night);--card:var(--haze);--btn:var(--night);--btn-fg:var(--cloud);--line:var(--night)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:color-mix(in srgb,var(--night) 30%,#000);--fg:var(--cloud);--card:var(--night);--btn:var(--rose);--btn-fg:var(--night);--line:var(--mist)}}
:root[data-theme=dark]{--bg:color-mix(in srgb,var(--night) 30%,#000);--fg:var(--cloud);--card:var(--night);--btn:var(--rose);--btn-fg:var(--night);--line:var(--mist)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.0625rem/1.55 var(--f-display)}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.02;letter-spacing:-.02em;font-weight:800}
h1{font-size:clamp(2.6rem,8vw,5.5rem)}h2{font-size:clamp(1.9rem,4.5vw,3rem)}h3{font-size:1.3rem}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}.sec{padding:64px 20px}
.mono{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);color:var(--cloud);border-bottom:1.5px solid var(--night)}
.nav{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.logo{display:block;margin-right:auto;line-height:0}.logo-img{height:40px;width:auto}footer .logo-img{height:48px}
.l{text-decoration:none;font:500 .8rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.l[aria-current=page]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.btn{display:inline-block;border:1.5px solid var(--line);background:var(--btn);color:var(--btn-fg);font:600 .95rem var(--f-display);padding:12px 22px;border-radius:var(--r-pill);text-decoration:none;cursor:pointer;transition:transform var(--fast) var(--ease)}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}.btn.alt{background:transparent;color:var(--fg)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.hero{display:grid;gap:40px;padding-block:64px;align-items:center}
@media(min-width:800px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{margin:16px 0 20px}.lede{max-width:34ch;font-size:1.2rem}.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.moon,.ph{position:relative}.moon .art{border-radius:var(--r-md);border:1.5px solid var(--line)}
.patch{position:absolute;left:-8px;bottom:24px;background:var(--butter);color:var(--night);padding:10px 16px;border-radius:var(--r-pill);border:1.5px solid var(--night);transform:rotate(-6deg)}
.ticker{overflow:hidden;border-block:1.5px solid var(--night);background:var(--butter);color:var(--night)}
.ticker div{display:flex;width:max-content;padding-block:10px;animation:slide 30s linear infinite}.ticker span{margin-right:40px;white-space:nowrap}
@keyframes slide{to{transform:translateX(-50%)}}@keyframes spin{to{transform:rotate(360deg)}}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-decoration:none;transition:transform var(--fast) var(--ease)}
.card:hover{transform:translateY(-4px)}.art{display:block;width:100%;height:auto;aspect-ratio:1}.orbit{transform-origin:100px 100px;animation:spin 18s linear infinite}
.tag{position:absolute;top:12px;left:12px;background:var(--butter);color:var(--night);padding:4px 10px;border-radius:var(--r-pill)}
.b{padding:16px 18px 20px;display:grid;gap:10px}.row{display:flex;justify-content:space-between}
.spec{border-top:1.5px dashed var(--line);padding-top:10px;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 36px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--fg);padding:8px 16px;border-radius:var(--r-pill);cursor:pointer}
.chip[aria-pressed=true]{background:var(--rose);color:var(--night)}
.vid{display:grid;gap:24px;align-items:center}@media(min-width:800px){.vid{grid-template-columns:1.2fr 1fr}}
.screen{aspect-ratio:16/9;background:var(--night);border-radius:var(--r-md);display:grid;place-items:center;border:1.5px solid var(--line)}
.screen i{width:0;height:0;border-left:34px solid var(--rose);border-block:20px solid transparent}
.posts{display:grid;gap:16px}.post{border-top:1.5px solid var(--line);padding-top:16px;display:grid;gap:6px}
.detail{display:grid;gap:40px}@media(min-width:800px){.detail{grid-template-columns:1fr 1fr}}
.detail .art{border:1.5px solid var(--line);border-radius:var(--r-md)}.detail h1{font-size:clamp(2.2rem,5vw,3.5rem);margin:12px 0}
.price{font:500 1.6rem var(--f-mono);margin:12px 0 20px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 24px;margin:32px 0 0}dd{margin:0}
.news{background:var(--rose);color:var(--night);padding:64px 0}.news h2{margin:12px 0 24px}
.news form{display:flex;gap:12px;flex-wrap:wrap}
.news input{flex:1 1 240px;font:inherit;padding:12px 20px;border-radius:var(--r-pill);border:1.5px solid var(--night);background:var(--cloud);color:var(--night)}
.news .btn{background:var(--night);color:var(--cloud)}
footer{background:var(--night);color:var(--cloud);padding:40px 0;display:block}footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
footer a{margin-right:16px}.about{max-width:60ch}.about p{margin-top:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
